# This is a basic workflow to help you get started with Actions

name: Run My Bash Script

on:
  workflow_dispatch:

jobs:
  run-bash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Bash commands
        run: |
          echo "Executing script..."
          date
          uname -a
